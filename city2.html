
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart City Image Mapping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    font-family: Arial, sans-serif;
}

.city-container {
    position: relative;
    width: 100%;
    max-width: 1650px;
    margin: auto;
}

.city-container img {
    width: 100%;
    height: auto;
    display: block;
}

.city-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.hotspot {
    fill: transparent;
    stroke: transparent;
    stroke-width: 3;
    cursor: pointer;
    transition: 0.3s;
}

.hotspot:hover {
    fill: rgba(255, 255, 255, 0.02);
    stroke: #fefefe00;
}

</style>
</head>

<body>

<div class="city-container">

<img src="Image2.png" alt="Smart City Map">

<svg class="city-map"
     viewBox="0 0 1650 900"
     preserveAspectRatio="none">

    <!-- BANK -->
    

    <!-- HOSPITAL -->
    <a href="hospital.html">
        <polygon class="hotspot"
        points="965,185 1335,185 1335,480 965,480">
        <title>Hospital</title>
        </polygon>
    </a>

    <!-- NETWORK TOWER -->
    <a href="network.html">
        <polygon class="hotspot"
        points="1350,80 1510,80 1510,520 1350,520">
        <title>Network Tower</title>
        </polygon>
    </a>

    <!-- GREEN BUS -->
    <a href="bus.html">
        <polygon class="hotspot"
        points="770,550 820,550 820,670 770,670">
        <title>Green Bus</title>
        </polygon>
    </a>

    <!-- RED HOUSE -->
    <a href="redhouse.html">
        <polygon class="hotspot"
        points="0,260 125,260 125,425 0,425">
        <title>Red House</title>
        </polygon>
    </a>

    <!-- YELLOW HOUSE -->
    <a href="yellowhouse.html">
        <polygon class="hotspot"
        points="1200,0 1340,0 1340,150 1200,150">
        <title>Yellow House</title>
        </polygon>
    </a>

</svg>

</div>

</body>
</html>
